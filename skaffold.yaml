apiVersion: skaffold/v4beta11
kind: Config

# Build is shared by every profile; each profile owns its own `deploy` (so the
# local Helm release never leaks into a cloud `skaffold run`, and vice-versa).
build:
  artifacts:
    - image: bgc-data-portal-django
      context: django
      docker:
        dockerfile: Dockerfile.dev
      platforms:
        - linux/arm64   # M3 Pro / Apple Silicon; change to linux/amd64 for Intel/CI
      sync:
        manual:
          - src: "**/*.py"
            dest: /app
          - src: "**/*.html"
            dest: /app
          - src: "**/*.css"
            dest: /app
          - src: "**/*.js"
            dest: /app
    - image: bgc-data-portal-django-worker
      context: django
      docker:
        dockerfile: Dockerfile.worker.dev
      platforms:
        - linux/arm64   # M3 Pro / Apple Silicon; change to linux/amd64 for Intel/CI
      sync:
        manual:
          - src: "**/*.py"
            dest: /app
          - src: "**/*.html"
            dest: /app
          - src: "**/*.css"
            dest: /app
          - src: "**/*.js"
            dest: /app
  local:
    push: false

portForward:
  # Reliable port-forward for macOS (NodePort via cluster port-maps is unreliable
  # on Docker Desktop / Colima's network stack). Access the app at
  # http://localhost:8080. Skaffold rewrites built image refs into the Helm
  # release via its built-in `--post-renderer`, so the chart's bare image names
  # (bgc-data-portal-django, …-worker) resolve to the locally-built tags.
  - resourceType: service
    resourceName: bgc-data-portal-django
    namespace: bgc-local
    port: 80
    localPort: 8080

profiles:
  # ── local ──────────────────────────────────────────────────────────────────
  # Auto-activated when kubeContext is k3d-bgc-local.
  # Usage: make dev   OR   skaffold dev -p local
  # Deploys the canonical chart (deployments/chart) with the laptop values.
  - name: local
    activation:
      - kubeContext: k3d-bgc-local
    deploy:
      helm:
        releases:
          - name: bgc-local
            chartPath: deployments/chart
            valuesFiles:
              - deployments/chart/values-laptop.yaml
            namespace: bgc-local
            createNamespace: true

  # ── local-full ─────────────────────────────────────────────────────────────
  # Same as local plus the workspace pod (Claude Code isolated env).
  # Usage: make dev-full   OR   skaffold dev -p local-full
  - name: local-full
    build:
      artifacts:
        - image: bgc-data-portal-django
          context: django
          docker:
            dockerfile: Dockerfile.dev
          platforms:
            - linux/arm64
          sync:
            manual:
              - src: "**/*.py"
                dest: /app
              - src: "**/*.html"
                dest: /app
              - src: "**/*.css"
                dest: /app
              - src: "**/*.js"
                dest: /app
        - image: bgc-data-portal-django-worker
          context: django
          docker:
            dockerfile: Dockerfile.worker.dev
          platforms:
            - linux/arm64
          sync:
            manual:
              - src: "**/*.py"
                dest: /app
              - src: "**/*.html"
                dest: /app
              - src: "**/*.css"
                dest: /app
              - src: "**/*.js"
                dest: /app
        - image: bgc-data-portal-workspace
          context: django
          docker:
            dockerfile: Dockerfile.workspace
          platforms:
            - linux/arm64
          # NO sync block — workspace is isolated, no host file sync by design
      local:
        push: false
    deploy:
      helm:
        releases:
          - name: bgc-local
            chartPath: deployments/chart
            valuesFiles:
              - deployments/chart/values-laptop.yaml
              - deployments/chart/values-workspace.yaml
            namespace: bgc-local
            createNamespace: true

  # ── dev / prod (cloud) ───────────────────────────────────────────────────────
  # DEPRECATED here: cloud deploys now live in the private mgnify-bgcs-deployer
  # repo (Helm chart + per-env values: `make deploy-dev` / `make deploy-prod`
  # there). These profiles still deploy the legacy hand-written manifests and are
  # kept only until the cutover is confirmed; do not add new config here.
  - name: dev
    build:
      artifacts:
        - image: quay.io/microbiome-informatics/bgc_dp_web_site
          context: django
          docker:
            dockerfile: Dockerfile.dev
          platforms:
            - linux/amd64
          sync:
            manual:
              - src: "**/*.py"
                dest: /app
              - src: "**/*.html"
                dest: /app
              - src: "**/*.css"
                dest: /app
              - src: "**/*.js"
                dest: /app
        - image: quay.io/microbiome-informatics/bgc_dp_web_site_worker
          context: django
          docker:
            dockerfile: Dockerfile.worker.dev
          platforms:
            - linux/amd64
          sync:
            manual:
              - src: "**/*.py"
                dest: /app
              - src: "**/*.html"
                dest: /app
              - src: "**/*.css"
                dest: /app
              - src: "**/*.js"
                dest: /app
      local:
        push: true
    manifests:
      rawYaml:
        - deployments/k8s-dev/ebi-wp-k8s-hl.yaml
    deploy:
      kubectl:
        defaultNamespace: bgc-data-portal-hl-exp
        hooks:
          before:
            - host:
                command:
                  - sh
                  - -c
                  - |
                    kubectl --context "$SKAFFOLD_KUBE_CONTEXT" -n bgc-data-portal-hl-exp \
                      delete job bgc-integration-tests bgc-e2e-tests --ignore-not-found
                os: [darwin, linux]

  - name: prod
    build:
      artifacts:
        - image: quay.io/microbiome-informatics/bgc_dp_web_site
          context: django
          docker:
            dockerfile: Dockerfile
          platforms:
            - linux/amd64
        - image: quay.io/microbiome-informatics/bgc_dp_web_site_worker
          context: django
          docker:
            dockerfile: Dockerfile.worker
          platforms:
            - linux/amd64
      local:
        push: true
    manifests:
      rawYaml:
        - deployments/k8s-prod/ebi-wp-k8s-hl.yaml
    deploy:
      kubectl:
        defaultNamespace: bgc-data-portal-hl-prod
        hooks:
          before:
            - host:
                command:
                  - sh
                  - -c
                  - |
                    kubectl --context "$SKAFFOLD_KUBE_CONTEXT" -n bgc-data-portal-hl-prod \
                      delete job bgc-integration-tests bgc-e2e-tests --ignore-not-found
                os: [darwin, linux]
