apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: protein-search-index
  namespace: bgc-local
spec:
  # Single-node Kind: RWO is enough for both the celery (writer) and django
  # pods to mount it, and unlike emptyDir it survives pod recreation, so the
  # index built by `load_discovery_data` / `make build-protein-index` persists
  # across Skaffold worker-image rebuilds.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
