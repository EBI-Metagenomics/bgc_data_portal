# =============================================================================
# laptop / self-host target.
#
#   helm install bgc ./chart -f ./chart/values-laptop.yaml --namespace bgc-local
#
# This is the shape that used to live in deployments/k8s-local/manifests/:
# public images, NodePort access (no ingress), runserver + watchmedo hot-reload,
# init-container migrations, and emptyDir/RWO volumes. Self-hosters and the
# k3d dev loop both render from here.
#
# Base values.yaml is intentionally minimal (Helm deep-merges maps, so anything
# map-shaped a target needs to fully own — config.data, probes, service — must
# be declared here, not inherited).
# =============================================================================

# The namespace is created out-of-band — `helm install --create-namespace`,
# Skaffold's release createNamespace, or `make create-local-namespace` — so the
# chart does not also render a (cluster-scoped) Namespace object inside the release.
namespace:
  name: bgc-local
  create: false

imagePullSecrets: []

secretName: bgc-data-portal-secret

config:
  enabled: true
  name: app-config
  data:
    DJANGO_DEBUG: "True"
    ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,*"
    LOG_LEVEL: "DEBUG"
    MATOMO_URL: ""
    MATOMO_SITE_ID: ""
    NUMBA_CACHE_DIR: /tmp/numba_cache
    CLASSYFIRE_URL: "http://classyfire.wishartlab.com"

postgres:
  image: pgvector/pgvector:pg18-trixie
  imagePullPolicy: ""
  storage: 5Gi
  headlessService: false
  includeSecret: true
  includeConfig: false
  env:
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
  volumes: []
  volumeMounts:
    - name: db-data
      mountPath: /var/lib/postgresql
  readinessProbe:
    exec:
      command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe: {}

django:
  image: bgc-data-portal-django
  imagePullPolicy: ""
  podSecurityContext: {}
  containerSecurityContext: {}
  includeSecret: true
  includeConfig: true
  workingDir: /app
  command: [python, manage.py, runserver, "0.0.0.0:8000"]
  env:
    - name: PROTEIN_SEARCH_INDEX_DIR
      value: /data/protein_search
    - name: CLUSTERING_ARTIFACTS_DIR
      value: /data/clustering_artifacts
    # Upload staging shared with the worker pod via the clustering-artifacts PVC
    # (both pods mount it). Replaces the old Redis hand-off of the upload bytes.
    - name: UPLOAD_STAGING_DIR
      value: /data/clustering_artifacts/upload_staging
  # init-container images follow django.image (set by the template), so none is
  # specified here — a single image override covers main + init containers.
  initContainers:
    - name: wait-for-postgres
      command:
        - sh
        - -c
        - |
          until python -c "import socket; socket.create_connection(('postgres', 5432))" 2>/dev/null; do
            echo "waiting for postgres..."; sleep 2
          done
    - name: migrate
      workingDir: /app
      command:
        - sh
        - -c
        - |
          python manage.py migrate --noinput && \
          python manage.py createcachetable
      envFrom:
        - secretRef:
            name: bgc-data-portal-secret
        - configMapRef:
            name: app-config
  volumes:
    - name: packages
      emptyDir: {}
    - name: protein-search-index
      persistentVolumeClaim:
        claimName: protein-search-index
    - name: clustering-artifacts
      persistentVolumeClaim:
        claimName: clustering-artifacts
  volumeMounts:
    - name: packages
      mountPath: /data/packages
    - name: protein-search-index
      mountPath: /data/protein_search
    - name: clustering-artifacts
      mountPath: /data/clustering_artifacts
  readinessProbe:
    httpGet:
      path: /api/docs
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 6
  service:
    type: NodePort
    port: 80
    targetPort: 8000
    nodePort: 30080

worker:
  image: bgc-data-portal-django-worker
  imagePullPolicy: ""
  podSecurityContext: {}
  containerSecurityContext: {}
  includeSecret: true
  includeConfig: true
  workingDir: /app
  # Block until Postgres accepts connections before the worker's command runs
  # createcachetable — otherwise the worker races Postgres startup under
  # `skaffold dev` and its first-boot crash fails the deploy's stabilize check.
  initContainers:
    - name: wait-for-postgres
      image: bgc-data-portal-django-worker
      command:
        - sh
        - -c
        - |
          until python -c "import socket; socket.create_connection(('postgres', 5432))" 2>/dev/null; do
            echo "waiting for postgres..."; sleep 2
          done
  # django-tasks db_worker polls the Postgres queue (both queues). --reload
  # defaults to DEBUG, giving the same hot-reload watchmedo used to provide.
  # createcachetable is idempotent — safe to run here as well as in the django
  # init container, and guards against the worker racing ahead of migrations.
  command:
    - sh
    - -c
    - |
      python manage.py createcachetable && \
      python manage.py db_worker --queue-name default,scores
  env:
    - name: PROTEIN_SEARCH_INDEX_DIR
      value: /data/protein_search
    - name: CLUSTERING_ARTIFACTS_DIR
      value: /data/clustering_artifacts
    - name: UPLOAD_STAGING_DIR
      value: /data/clustering_artifacts/upload_staging
  volumes:
    - name: packages
      emptyDir: {}
    - name: protein-search-index
      persistentVolumeClaim:
        claimName: protein-search-index
    - name: clustering-artifacts
      persistentVolumeClaim:
        claimName: clustering-artifacts
  volumeMounts:
    - name: packages
      mountPath: /data/packages
    - name: protein-search-index
      mountPath: /data/protein_search
    - name: clustering-artifacts
      mountPath: /data/clustering_artifacts

staticNginx:
  enabled: false

ingress:
  enabled: false

pvcs:
  - name: protein-search-index
    accessModes: [ReadWriteOnce]
    storage: 5Gi
  - name: clustering-artifacts
    accessModes: [ReadWriteOnce]
    storage: 2Gi

tests:
  enabled: false
