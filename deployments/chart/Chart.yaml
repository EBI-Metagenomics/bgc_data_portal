apiVersion: v2
# Chart name is also the final OCI path segment: `helm push` appends it, so the
# published artifact is oci://quay.io/microbiome-informatics/bgc-data-portal-chart.
name: bgc-data-portal-chart
description: >-
  BGC Data Portal — Django web app, Celery worker, and their backing services
  (PostgreSQL/pgvector, Redis, RabbitMQ). One chart, rendered for three targets:
  laptop/self-host (chart defaults), cloud-dev and cloud-prod (values supplied by
  the private mgnify-bgcs-deployer repo).
type: application
# Chart version tracks the deployment topology, not the app. Bump it on any
# change to the chart (templates, defaults, or this metadata) — it becomes the
# published OCI tag (oci://.../bgc-data-portal-chart:<version>) that prod pins.
version: 3.10.0
# appVersion is the app release this chart revision was published alongside — a
# reference/default only. The version actually deployed is the container image
# tag in the per-target values file (immutable :X.Y.Z-<sha> for prod), which
# overrides any default here. Keep this in step with the latest portal release.
appVersion: "3.10.0"
# Floor is the oldest cluster we deploy to (EBI HL exp/prod run v1.23.x). The chart
# only uses GA APIs available well before then (apps/v1, networking.k8s.io/v1
# Ingress, batch/v1 Job), so 1.23 is the true minimum — not 1.25.
kubeVersion: ">=1.23.0-0"
maintainers:
  - name: MGnify / Microbiome Informatics
    url: https://github.com/EBI-Metagenomics
