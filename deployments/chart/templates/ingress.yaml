{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bgc-data-portal-ingress
  namespace: {{ include "bgc.namespace" . }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  rules:
    {{- toYaml .Values.ingress.rules | nindent 4 }}
{{- end }}
