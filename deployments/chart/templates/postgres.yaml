{{- if .Values.postgres.enabled }}
{{- $ns := include "bgc.namespace" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- with .Values.postgres.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.postgres.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            {{- if .Values.postgres.includeSecret }}
            - secretRef:
                name: {{ .Values.secretName }}
            {{- end }}
            {{- if and .Values.config.enabled .Values.postgres.includeConfig }}
            - configMapRef:
                name: {{ .Values.config.name }}
            {{- end }}
          ports:
            - containerPort: 5432
          {{- with .Values.postgres.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgres.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- toYaml .Values.postgres.volumeMounts | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
spec:
  {{- if .Values.postgres.headlessService }}
  clusterIP: None
  {{- end }}
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
