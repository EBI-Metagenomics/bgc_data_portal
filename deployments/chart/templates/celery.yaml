{{- if .Values.celery.enabled }}
{{- $ns := include "bgc.namespace" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgc-data-portal-celery
  namespace: {{ $ns }}
  labels:
    app: bgc-data-portal-celery
spec:
  replicas: {{ .Values.celery.replicas }}
  selector:
    matchLabels:
      app: bgc-data-portal-celery
  template:
    metadata:
      labels:
        app: bgc-data-portal-celery
    spec:
      {{- with .Values.celery.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: celery
          {{- with .Values.celery.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.celery.image }}
          {{- with .Values.celery.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.celery.workingDir }}
          workingDir: {{ . }}
          {{- end }}
          command:
            {{- toYaml .Values.celery.command | nindent 12 }}
          {{- with .Values.celery.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            {{- if .Values.celery.includeSecret }}
            - secretRef:
                name: {{ .Values.secretName }}
            {{- end }}
            {{- if and .Values.config.enabled .Values.celery.includeConfig }}
            - configMapRef:
                name: {{ .Values.config.name }}
            {{- end }}
          {{- with .Values.celery.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
