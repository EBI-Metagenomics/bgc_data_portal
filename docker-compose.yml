version: "3.9"

services:
  db:
    build: ./db
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npx vite build --watch"
    volumes:
      - ./django/frontend:/app/frontend
      - ./django/static:/app/static
      - frontend_node_modules:/app/frontend/node_modules
    healthcheck:
      test: ["CMD", "test", "-f", "/app/static/dashboard/assets/index.js"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 30s

  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    env_file: .env
    command: >
      sh -c "
             python manage.py migrate &&
             python manage.py createcachetable &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
        - ./django:/app
        - ingest_packages:/data/packages
        - /Users/fragoso/.cache/huggingface:/data/huggingface # DEBUG
    environment:
      - MEDIA_ROOT=/data/packages
      # Upload staging shared with the worker via the ingest_packages volume.
      - UPLOAD_STAGING_DIR=/data/packages/upload_staging
      - HF_HOME=/data/huggingface # DEBUG
    depends_on:
      db:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./django
      dockerfile: Dockerfile.worker
    env_file: .env
    command: >
        sh -c "
        # wait for Django to finish its migrations + cache table
        sleep 15 &&
        python manage.py createcachetable &&
        python manage.py db_worker --queue-name default,scores "
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./django:/app # DEBUG
      - ingest_packages:/data/packages
      - /Users/fragoso/.cache/huggingface:/data/huggingface # DEBUG
    environment:
      - UPLOAD_STAGING_DIR=/data/packages/upload_staging
      - HF_HOME=/data/huggingface # DEBUG

volumes:
  db_data:
  frontend_node_modules:
  ingest_packages:
