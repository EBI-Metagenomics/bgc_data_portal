# Tooling configuration only. Runtime dependencies live in
# django/requirements-*.txt (+ .lock); there is no installable package.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "django/discovery/migrations",
    "django/staticfiles",
    "django/static",
    "django/frontend",
    "django/docs",
]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, UP: modern syntax,
# B: bugbear, SIM: simplifications, C4: comprehensions.
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # line length is the formatter's job; long strings/URLs are fine
    "B905",  # zip(strict=...) adds noise on same-length lists
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bgc_data_portal.settings"
pythonpath = ["django"]
testpaths = ["django/tests"]
python_files = ["test_*.py"]
markers = [
    "e2e: end-to-end browser tests (pytest-playwright)",
]
