project:
  type: website
  output-dir: _site

execute:
  freeze: auto

website:
  title: "MGnify BGCs Discovery Platform"
  description: "Guide and reference for the MGnify BGC Discovery Platform."
  page-navigation: true
  reader-mode: true

  navbar:
    background: "#18974c"
    foreground: "#ffffff"
    left:
      - text: "Platform Overview"
        href: index.qmd
      - text: "Key Concepts"
        href: key-concepts.qmd
      - text: "Quickstart"
        href: quickstart.qmd
      - text: "Walkthrough"
        href: walkthrough.qmd
    right:
      - text: "Visit MGnify BGCs"
        href: ../
      - icon: github
        href: https://github.com/EBI-Metagenomics/bgc_data_portal

  sidebar:
    - id: docs
      style: docked
      search: true
      collapse-level: 1
      contents:
        - section: "Getting Started"
          contents:
            - text: "Platform Overview"
              href: index.qmd
            - text: "Key Concepts"
              href: key-concepts.qmd
            - text: "Quickstart"
              href: quickstart.qmd
            - text: "Walkthrough"
              href: walkthrough.qmd
        - section: "The Discovery Platform"
          contents:
            - text: "Discovery Platform Overview"
              href: dashboard-overview.qmd
            - text: "BGC Roster"
              href: bgc-roster.qmd
            - text: "Variables Map"
              href: variables-map.qmd
            - text: "UMAP"
              href: umap.qmd
            - text: "iBGC Detail"
              href: ibgc-detail.qmd
            - text: "Protein Panel"
              href: protein-panel.qmd
            - text: "Filtering"
              href: filtering.qmd
            - text: "Accessions Field"
              href: accessions.qmd
            - text: "Load Asset"
              href: load-asset.qmd
        - section: "Searching"
          contents:
            - text: "Search Overview"
              href: search-overview.qmd
            - text: "Domain Search"
              href: domain-query.qmd
            - text: "Sequence Search"
              href: sequence-search.qmd
            - text: "Chemical Search"
              href: chemical-search.qmd
            - text: "Find Similar iBGCs"
              href: similar-ibgc.qmd
        - section: "Shortlist & Report"
          contents:
            - text: "Shortlists"
              href: shortlists.qmd
            - text: "The Report"
              href: report.qmd
            - text: "Export Formats"
              href: export-formats.qmd
        - section: "The Data"
          contents:
            - text: "How the Data Is Built"
              href: how-data-is-built.qmd
            - text: "What's in the Catalogue"
              href: datasets.qmd
        - section: "Reference"
          contents:
            - text: "Scores & Metrics"
              href: scores-metrics.qmd
            - text: "BGC Classes"
              href: bgc-classes.qmd
            - text: "Gene Cluster Families"
              href: gcf-explained.qmd
            - text: "ChemOnt"
              href: chemont.qmd
            - text: "Biome Ontology"
              href: biome-ontology.qmd
            - text: "MIBiG & Validated BGCs"
              href: mibig-validated.qmd
            - text: "Glossary"
              href: glossary.qmd
        - section: "About"
          contents:
            - text: "About"
              href: about.qmd

  page-footer:
    left: "© 2026 EMBL-EBI"
    right:
      - icon: github
        href: https://github.com/EBI-Metagenomics/bgc_data_portal

format:
  html:
    theme:
      - zephyr
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    embed-resources: true
