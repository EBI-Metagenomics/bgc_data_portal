name: Build and Push Docker Images

# Image tagging contract (see docs/runbooks/.../versioning-and-releases.md):
#
#   Trigger                          Tags pushed
#   ──────────────────────────────   ─────────────────────────────────────────────
#   workflow_call (is_release=true)  :X.Y.Z  :X.Y.Z-<sha7>  :sha-<sha7>  :latest
#   push to dev                      :sha-<sha7>  :dev
#   workflow_dispatch (ref=tag)      :X.Y.Z  :X.Y.Z-<sha7>  :sha-<sha7>   (backfill)
#   workflow_dispatch (ref=sha)      :sha-<sha7>
#
# Immutable tags (:X.Y.Z, :X.Y.Z-<sha7>, :sha-<sha7>) are what production pins.
# :latest / :dev are moving convenience pointers for exp/dev only — never pin
# them in a prod values file.
#
# Production images are built ONLY for a real release: release-please.yml calls
# this workflow (workflow_call) once it has cut the GitHub release+tag, passing
# the tag as `ref` and `is_release: true`. We call it rather than listening for
# `release: published` because release-please creates the release with the
# default GITHUB_TOKEN, and GitHub does not trigger workflows from GITHUB_TOKEN
# events — so a `release:` trigger here would never fire. Chaining via
# workflow_call runs in the same workflow run and sidesteps that entirely.
#
# The release tag carries a component prefix (bgc_data_portal-vX.Y.Z); we strip
# it down to the bare semver for the image tag. `workflow_dispatch` exists to
# backfill an immutable image for a tag cut before this workflow existed (or
# whose release build failed), without forcing a new release — it never moves
# :latest. There is deliberately NO `push: main` build: main lands via the
# release PR, and the release path above owns prod images.

on:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        description: "Git ref (release tag like bgc_data_portal-vX.Y.Z) to build"
        required: true
        type: string
      is_release:
        description: "True for a real release — also moves :latest"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag like bgc_data_portal-v3.3.1, branch, or full SHA)"
        required: true
        type: string

env:
  REGISTRY: quay.io
  IMAGE_NAMESPACE: microbiome-informatics

# Least privilege: this workflow only checks out code and pushes images to
# Quay (via QUAY_* secrets, not GITHUB_TOKEN), so read-only is sufficient.
permissions:
  contents: read

jobs:
  docker:
    name: Build & Push Services
    runs-on: ubuntu-latest
    # workflow_call / workflow_dispatch always pass `inputs.ref`; a bare dev push
    # has no inputs but lands on refs/heads/dev. (Under workflow_call the github
    # context is the CALLER's, so we key off `inputs`, not github.event_name/ref.)
    if: >-
      inputs.ref != '' ||
      github.ref == 'refs/heads/dev'

    strategy:
      matrix:
        include:
          - folder: django
            image_name: bgc-data-portal-website
            dockerfile: Dockerfile
          - folder: django
            image_name: bgc-data-portal-website-worker
            dockerfile: Dockerfile.worker
          - folder: db
            image_name: pgvector
            dockerfile: Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_call/workflow_dispatch build the requested ref; a dev push
          # builds the pushed ref.
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"
          SHA7="$(git rev-parse --short=7 HEAD)"

          # `inputs.ref` is set for both workflow_call (release) and
          # workflow_dispatch (backfill); empty for a dev push.
          REF_NAME="${{ inputs.ref }}"
          IS_RELEASE="${{ inputs.is_release }}"

          # Strip an optional component prefix and leading v: bgc_data_portal-v3.3.1 -> 3.3.1
          VERSION=""
          if [[ "${REF_NAME}" =~ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi

          TAGS=()
          if [[ -n "${VERSION}" ]]; then
            # Immutable release artefacts — what prod pins.
            TAGS+=("${IMAGE}:${VERSION}")
            TAGS+=("${IMAGE}:${VERSION}-${SHA7}")
            TAGS+=("${IMAGE}:sha-${SHA7}")
            # Move :latest only for a real release call, never a historical backfill.
            if [[ "${IS_RELEASE}" == "true" ]]; then
              TAGS+=("${IMAGE}:latest")
            fi
          elif [[ -n "${REF_NAME}" ]]; then
            # workflow_dispatch on a non-tag ref (e.g. a bare SHA): commit-addressable only.
            TAGS+=("${IMAGE}:sha-${SHA7}")
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            TAGS+=("${IMAGE}:sha-${SHA7}")
            TAGS+=("${IMAGE}:dev")
          else
            echo "::error title=No tagging rule matched::event=${{ github.event_name }} ref=${{ github.ref }} inputs.ref='${REF_NAME}'" >&2
            exit 1
          fi

          printf 'tags<<EOF\n%s\nEOF\n' "$(IFS=$'\n'; echo "${TAGS[*]}")" >> "$GITHUB_OUTPUT"
          echo "Computed tags:"; printf '  %s\n' "${TAGS[@]}"

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.folder }}
          file: ./${{ matrix.folder }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Report digest
        run: |
          echo "::notice title=${{ matrix.image_name }} digest::${{ steps.build.outputs.digest }}"
          echo "Pushed ${{ matrix.image_name }} @ ${{ steps.build.outputs.digest }}"
