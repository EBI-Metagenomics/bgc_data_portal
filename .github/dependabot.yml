version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /django/frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /django
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
